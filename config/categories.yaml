# Categorias do Games News Hub e suas palavras-chave.
#
# Como editar:
#  - Adicione/remova palavras em "palavras" (português e inglês juntos).
#  - Não precisa se preocupar com maiúsculas ou acentos: "lançamento" e "lancamento" são iguais.
#  - A palavra precisa aparecer inteira (ex.: "pc" não casa com "capcom").
#  - Uma notícia pode ter várias categorias (ex.: "Xbox" + "Lançamentos").
#  - Notícias sem nenhuma palavra casando ficam em "geral".

# Se a fonte já é especializada, ela ganha automaticamente a categoria indicada.
categorias_por_fonte:
  Nintendo Life: nintendo
  Nintendo Blast: nintendo
  Push Square: playstation
  PSX Brasil: playstation
  Pure Xbox: xbox
  PC Gamer: pc
  Rock Paper Shotgun: pc
  GamesIndustry.biz: industria

# Colunas/séries recorrentes: títulos que contêm estes trechos NUNCA são agrupados
# (senão "Talking Point" de 3 sites viraria um "assunto muito coberto").
ignorar_agrupamento:
  - talking point
  - what are you playing
  - lançamentos da semana
  - coming out next week
  - coming to xbox next week
  - ofertas da semana
  - deals of the week

