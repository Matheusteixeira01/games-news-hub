# Fontes de notícias (feeds RSS) do Games News Hub.
#
# Como editar:
#  - Para adicionar um portal: copie um bloco "- nome: ..." e ajuste.
#  - Para desligar um portal sem apagar: troque "ativo: true" por "ativo: false".
#  - idioma: "pt" (português) ou "en" (inglês).
#
# Última checagem dos feeds: 2026-11-14 (rode "python src/check_feeds.py" para rechecar).
#
# Descartados por não terem feed funcional: The Enemy, Jovem Nerd, Game Arena.

fontes:
